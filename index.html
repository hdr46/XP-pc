<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>Win11 - XP PC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{width:100vw;height:100vh;overflow:hidden;background:url('https://wallpaperswide.com/download/windows_11_blue-wallpaper-1920x1080.jpg') center/cover no-repeat}
.start-menu{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:96%;max-width:580px;background:rgba(243,243,243,0.95);backdrop-filter:blur(30px);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:24px;display:none;flex-direction:column;z-index:100;animation:up .25s}
.start-menu.open{display:flex}
@keyframes up{from{transform:translateX(-50%) translateY(100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.search{width:100%;height:40px;background:white;border-radius:20px;border:1px solid #ddd;display:flex;align-items:center;padding:0 16px;gap:8px;margin-bottom:18px}
.search input{border:none;outline:none;width:100%;font-size:14px}
.pinned-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:6px;cursor:pointer}
.app:active{background:rgba(0,0,0,.08)}
.app img{width:32px;height:32px}
.app span{font-size:11px;text-align:center}
.rec-head{margin-top:20px}
.rec-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rec{display:flex;gap:10px;align-items:center;padding:6px;border-radius:6px}
.rec img{width:28px;height:28px}
.taskbar{position:fixed;bottom:0;left:0;width:100%;height:52px;background:rgba(243,243,243,0.85);backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px solid rgba(0,0,0,.1)}
.task-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.task-icon:hover{background:rgba(0,0,0,.08)}
.task-icon img{width:24px;height:24px}
.search-bar{width:200px;height:32px;background:white;border-radius:20px;display:flex;align-items:center;padding:0 12px;margin-right:12px}
</style>
</head>
<body>

<div id="startMenu" class="start-menu">
  <div class="search">🔍 <input placeholder="Search for apps, settings, and documents"></div>
  <div class="pinned-head"><b>Pinned</b><button style="padding:4px 10px;border-radius:6px;border:1px solid #ddd">All ></button></div>
  <div class="grid">
    <div class="app" onclick="window.open('https://office.com')"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"><span>Word</span></div>
    <div class="app" onclick="window.open('https://microsoftedge.com')"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"><span>Edge</span></div>
    <div class="app" onclick="window.open('https://youtube.com')"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"><span>YouTube</span></div>
    <div class="app" onclick="window.open('https://wa.me')"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"><span>WhatsApp</span></div>
    <div class="app" onclick="window.open('https://facebook.com')"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"><span>Facebook</span></div>
    <div class="app" onclick="window.open('https://instagram.com')"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"><span>Instagram</span></div>
    <div class="app"><img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png"><span>Settings</span></div>
    <div class="app"><img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"><span>File Explorer</span></div>
    <div class="app"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png"><span>Paint</span></div>
    <div class="app"><img src="https://cdn-icons-png.flaticon.com/512/2721/2721687.png"><span>Calculator</span></div>
    <div class="app"><img src="https://cdn-icons-png.flaticon.com/512/3917/3917036.png"><span>Clock</span></div>
    <div class="app"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665987.png"><span>Notepad</span></div>
  </div>
  <div class="rec-head pinned-head"><b>Recommended</b><button style="padding:4px 10px;border-radius:6px;border:1px solid #ddd">More ></button></div>
  <div class="rec-list">
    <div class="rec"><img src="https://cdn-icons-png.flaticon.com/512/732/732220.png"><div><div style="font-size:13px">Grammarly: AI Writing</div><div style="font-size:11px;color:#666">Write faster. Right now.</div></div></div>
    <div class="rec"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"><div><div style="font-size:13px">Windows 11 Cheat Sheet</div><div style="font-size:11px;color:#666">2m ago</div></div></div>
  </div>
  <div style="margin-top:18px;border-top:1px solid #ddd;padding-top:12px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:8px"><img src="https://i.pravatar.cc/32" style="border-radius:50%"><span style="font-size:13px">Preston Gralla</span></div><span>⏻</span>
  </div>
</div>

<div class="taskbar">
  <div class="task-icon" onclick="toggleStart()"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"></div>
  <div class="search-bar">🔍 Search web &...</div>
  <div class="task-icon"><img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"></div>
  <div class="task-icon"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"></div>
  <div class="task-icon"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"></div>
</div>

<script>
let open=false;
function toggleStart(){open=!open;document.getElementById('startMenu').classList.toggle('open',open)}
document.body.addEventListener('click',e=>{if(!e.target.closest('.start-menu')&&!e.target.closest('.task-icon')){open=false;document.getElementById('startMenu').classList.remove('open')}})
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js')
</script>
</body>
</html>
