<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') no-repeat center center fixed;background-size:cover;font-family:Tahoma;width:100vw;height:100vh;overflow:hidden}
#desktop{position:absolute;top:15px;left:15px}
.icon{width:75px;text-align:center;color:white;font-size:11px;text-shadow:1px 1px 2px black;margin-bottom:18px}
.icon div{font-size:42px;margin-bottom:3px}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:32px;background:#245EDC;display:flex;align-items:center;z-index:99}
#startBtn{background:#2E9C2E;color:white;padding:0 20px;height:100%;display:flex;align-items:center;font-weight:bold;font-style:italic}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" onclick="alert('My Computer')"><div>💻</div>My Computer</div>
  <div class="icon" onclick="alert('Files')"><div>📁</div>My Files</div>
  <div class="icon" onclick="alert('Photos')"><div>🖼️</div>Photos</div>
  <div class="icon" onclick="alert('USB')"><div>💾</div>USB Drive</div>
</div>
<div id="taskbar"><div id="startBtn">start</div></div>
</body>
</html>
