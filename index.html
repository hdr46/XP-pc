<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') no-repeat center center fixed;background-size:cover;font-family:Tahoma;height:100vh;overflow:hidden}
#desktop{position:absolute;top:10px;left:10px}
.icon{width:70px;text-align:center;color:white;font-size:11px;text-shadow:1px 1px 1px black;margin-bottom:15px}
.icon img{width:42px;height:42px;display:block;margin:0 auto 4px auto}
#mycompWin{position:absolute;top:15%;left:10%;width:80%;height:200px;background:#ECE9D8;border:2px solid #0055E5;display:none}
.title{background:#0055E5;color:white;padding:3px;display:flex;justify-content:space-between;font-size:13px}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:30px;background:#245EDC;display:flex;align-items:center}
#startBtn{background:#3BA33B;color:white;padding:2px 15px;border-radius:0 8px 8px 0;font-weight:bold;font-style:italic;font-size:16px}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'"><img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png">My Computer</div>
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'"><img src="https://win98icons.alexmeub.com/icons/png/directory_open_file_mydocs-4.png">My Files</div>
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'"><img src="https://win98icons.alexmeub.com/icons/png/camera-4.png">Photos</div>
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'"><img src="https://win98icons.alexmeub.com/icons/png/hard_disk-4.png">USB</div>
</div>
<div id="mycompWin"><div class="title"><span>My Computer</span><span onclick="this.parentElement.parentElement.style.display='none'" style="background:red;padding:0 6px">X</span></div><div style="padding:10px;font-size:13px">Welcome to XP! Your PWA is installed!</div></div>
<div id="taskbar"><div id="startBtn">start</div></div>
</body>
</html>
