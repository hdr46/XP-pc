<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') no-repeat center center fixed;background-size:cover;font-family:Tahoma;width:100vw;height:100vh;overflow:hidden}
#desktop{position:absolute;top:10px;left:10px}
.icon{width:80px;text-align:center;color:white;font-size:12px;text-shadow:1px 1px 2px black;margin-bottom:22px}
.box{width:48px;height:48px;margin:0 auto 5px auto;background:#ECE9D8;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:32px;border-radius:4px;box-shadow:2px 2px 4px black}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:32px;background:linear-gradient(#3C81F5,#245EDC);border-top:2px solid #6BBAFF;display:flex;align-items:center;z-index:999}
#startBtn{background:linear-gradient(#3DBB3D,#1F7A1F);color:white;padding:0 18px;height:24px;display:flex;align-items:center;font-weight:bold;font-style:italic;border-radius:0 10px 10px 0;box-shadow:1px 1px 3px black}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon"><div class="box">🖥️</div>My Computer</div>
  <div class="icon"><div class="box">📁</div>My Files</div>
  <div class="icon"><div class="box">🌄</div>Photos</div>
  <div class="icon"><div class="box">🔌</div>USB Drive</div>
</div>
<div id="taskbar"><div id="startBtn">start</div></div>
</body>
</html>
