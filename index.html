<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') no-repeat center center fixed;background-size:cover;font-family:Tahoma;width:100vw;height:100vh;overflow:hidden}
#desktop{position:absolute;top:10px;left:10px}
.icon{width:75px;text-align:center;color:white;font-size:11px;text-shadow:1px 1px 2px black;margin-bottom:18px;cursor:pointer}
.icon img{width:42px;height:42px;display:block;margin:0 auto 4px auto}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:32px;background:linear-gradient(#3C81F5,#245EDC);border-top:2px solid #6BB3FF;display:flex;align-items:center;z-index:99}
#startBtn{background:linear-gradient(#3DBB3D,#1E7A1E);color:white;padding:0 20px;height:24px;display:flex;align-items:center;font-weight:bold;font-style:italic;border-radius:0 12px 12px 0;box-shadow:2px 0 4px rgba(0,0,0,0.5);font-size:15px}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon"><img src="https://img.icons8.com/color/48/my-computer.png">My Computer</div>
  <div class="icon"><img src="https://img.icons8.com/color/48/folder-invoices.png">My Files</div>
  <div class="icon"><img src="https://img.icons8.com/color/48/image--v1.png">Photos</div>
  <div class="icon"><img src="https://img.icons8.com/color/48/usb-memory-stick.png">USB Drive</div>
</div>
<div id="taskbar"><div id="startBtn">start</div></div>
</body>
</html>
