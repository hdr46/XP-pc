<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Win7 Fixed</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#008080;font-family:Tahoma;height:100vh;overflow:hidden}
#desktop{position:absolute;top:10px;left:10px}.dicon{width:70px;text-align:center;color:#fff;font-size:11px;margin-bottom:15px;cursor:pointer}.box{width:48px;height:48px;background:#fff3;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 4px}
.win{position:fixed;background:#f0f0f0;border:2px solid #000;display:none;z-index:100;top:10%;left:5%;width:90%;height:70%}.tbar{background:#000080;color:#fff;padding:5px;display:flex;justify-content:space-between}.close{background:red;padding:2px 8px;cursor:pointer}
.wbody{background:#fff;height:calc(100% - 28px);overflow:auto;padding:10px}
#startMenu{position:fixed;bottom:36px;left:0;width:320px;height:360px;background:#c0c0c0;border:2px outset #fff;display:none;z-index:500}
#startMenu.open{display:block}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:36px;background:#c0c0c0;border-top:2px outset #fff;display:flex;justify-content:space-between;align-items:center;z-index:600}
#startBtn{background:#000080;color:#fff;padding:5px 15px;margin-left:5px;cursor:pointer;font-weight:bold}
</style></head><body>
<div id="desktop">
<div class="dicon" onclick="openApp('computer')"><div class="box">💻</div>My Computer</div>
<div class="dicon" onclick="openApp('files')"><div class="box">📁</div>My Files</div>
<div class="dicon" onclick="openApp('recycle')"><div class="box">🗑️</div>Recycle Bin</div>
</div>

<div id="startMenu"><div style="padding:10px">
<div onclick="openApp('computer')" style="padding:8px;background:#fff;margin:3px;cursor:pointer">💻 My Computer</div>
<div onclick="openApp('files')" style="padding:8px;background:#fff;margin:3px;cursor:pointer">📁 My Files</div>
<div onclick="openApp('recycle')" style="padding:8px;background:#fff;margin:3px;cursor:pointer">🗑️ Recycle Bin</div>
<button onclick="location.reload()" style="margin-top:20px">🔴 Shutdown</button>
</div></div>

<div id="win-computer" class="win"><div class="tbar"><span>My Computer</span><span class="close" onclick="closeApp('computer')">X</span></div><div class="wbody"><div id="driveInfo"></div><br><button onclick="document.getElementById('realFile').click()">📤 Upload File</button><input type="file" id="realFile" style="display:none" multiple onchange="handleFiles(this.files)"></div></div>
<div id="win-files" class="win"><div class="tbar"><span>My Files</span><span class="close" onclick="closeApp('files')">X</span></div><div class="wbody" id="filesBody"></div></div>
<div id="win-recycle" class="win"><div class="tbar"><span>Recycle Bin</span><span class="close" onclick="closeApp('recycle')">X</span></div><div class="wbody"><div id="recycleList"></div><br><button onclick="emptyRecycle()">Empty Bin</button> <button onclick="restoreAll()">Restore All</button></div></div>

<div id="taskbar"><div id="startBtn" onclick="toggleStart()">Start</div><div id="clock">Win7</div></div>

<script>
function openApp(id){document.querySelectorAll('.win').forEach(w=>w.style.display='none');document.getElementById('win-'+id).style.display='block';document.getElementById('startMenu').classList.remove('open'); if(id=='computer') loadDrives(); if(id=='files') loadFilesApp(); if(id=='recycle') loadRecycleBin();}
function closeApp(id){document.getElementById('win-'+id).style.display='none';}
function toggleStart(){document.getElementById('startMenu').classList.toggle('open');}
let realFiles=JSON.parse(localStorage.getItem('real_files')||'[]');
async function loadDrives(){let info=document.getElementById('driveInfo'); if(!info) return; let used=0; realFiles.forEach(f=>used+=f.size||0); let usedMB=(used/1024/1024).toFixed(2); info.innerHTML=`<b>C: Drive</b><br>Used: ${usedMB} MB<br>Files: ${realFiles.length}<br><div style="border:1px solid #000;height:12px"><div style="background:blue;height:100%;width:${Math.min(usedMB/10*100,100)}%"></div></div>`;}
function handleFiles(files){for(let f of files){realFiles.push({name:f.name,size:f.size});} localStorage.setItem('real_files',JSON.stringify(realFiles)); loadDrives(); loadFilesApp(); alert('✅ OK DONE! '+files.length+' files');}
function loadFilesApp(){let body=document.getElementById('filesBody'); if(!body) return; if(realFiles.length==0){body.innerHTML='No files'; return;} body.innerHTML=realFiles.map((f,i)=>`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #ccc">${f.name} (${(f.size/1024/1024).toFixed(2)} MB) <button onclick="deleteRealFile(${i})" style="background:red;color:#fff">X</button></div>`).join('');}
function deleteRealFile(i){let rec=JSON.parse(localStorage.getItem('real_recycle')||'[]'); rec.push(realFiles[i]); realFiles.splice(i,1); localStorage.setItem('real_files',JSON.stringify(realFiles)); localStorage.setItem('real_recycle',JSON.stringify(rec)); loadFilesApp(); loadDrives(); loadRecycleBin();}
function loadRecycleBin(){let rec=JSON.parse(localStorage.getItem('real_recycle')||'[]'); let box=document.getElementById('recycleList'); if(!box) return; if(rec.length==0){box.innerHTML='Empty'; return;} box.innerHTML=rec.map((f,i)=>`<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #ccc">🗑️ ${f.name} <span><button onclick="restoreFile(${i})">Restore</button> <button onclick="permanentDelete(${i})">Del</button></span></div>`).join('');}
function restoreFile(i){let rec=JSON.parse(localStorage.getItem('real_recycle')||'[]'); realFiles.push(rec[i]); rec.splice(i,1); localStorage.setItem('real_files',JSON.stringify(realFiles)); localStorage.setItem('real_recycle',JSON.stringify(rec)); loadFilesApp(); loadDrives(); loadRecycleBin();}
function permanentDelete(i){let rec=JSON.parse(localStorage.getItem('real_recycle')||'[]'); rec.splice(i,1); localStorage.setItem('real_recycle',JSON.stringify(rec)); loadRecycleBin(); loadDrives();}
function emptyRecycle(){localStorage.setItem('real_recycle','[]'); loadRecycleBin(); loadDrives();}
function restoreAll(){let rec=JSON.parse(localStorage.getItem('real_recycle')||'[]'); realFiles=realFiles.concat(rec); localStorage.setItem('real_files',JSON.stringify(realFiles)); localStorage.setItem('real_recycle','[]'); loadFilesApp(); loadDrives(); loadRecycleBin();}
loadDrives();
</script>
</body></html>
