<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>XP PC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:#000}
.desktop{width:100%;height:calc(100% - 30px);background:url('https://wallpaperswide.com/download/windows_xp_bliss-wallpaper-1920x1080.jpg') center/cover no-repeat;padding:8px;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;align-content:flex-start}
.icon{width:74px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-size:10px;text-shadow:1px 1px 1px black;text-align:center;cursor:pointer}
.icon img{width:32px;height:32px;margin-bottom:3px}
#startMenu{position:fixed;bottom:30px;left:0;width:280px;height:360px;background:#ECE9D8;border:2px solid #0058E6;border-bottom:none;border-radius:8px 8px 0 0;display:none;flex-direction:column;z-index:100;box-shadow:4px 0 15px rgba(0,0,0,.5)}
#startMenu.open{display:flex}
.start-top{height:54px;background:linear-gradient(#3c81f5,#245edb);display:flex;align-items:center;padding:0 10px;gap:8px;color:white;font-weight:bold;border-radius:6px 6px 0 0}
.start-body{display:flex;flex:1}
.start-left{flex:1.2;background:white;padding:6px;display:flex;flex-direction:column;gap:2px}
.start-right{flex:1;background:#D3E5FA;padding:6px;display:flex;flex-direction:column;gap:2px;border-left:1px solid #7AA5D6}
.s-item{padding:6px 8px;font-size:12px;display:flex;align-items:center;gap:6px;border-radius:2px}
.s-item:hover{background:#316AC5;color:white}
.taskbar{position:fixed;bottom:0;left:0;width:100%;height:30px;background:linear-gradient(#3c81f5 0%,#245edb 20%,#245edb 80%,#1941A5 100%);display:flex;align-items:center;z-index:200}
.start-btn{height:30px;padding:0 14px 0 8px;background:linear-gradient(#3fa13f,#1a7a1a);color:white;font-weight:bold;font-style:italic;border-radius:0 10px 10px 0;display:flex;align-items:center;gap:4px;box-shadow:inset 0 1px 1px rgba(255,255,255,.5);cursor:pointer}
.win{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:360px;height:60%;background:#ECE9D8;border:2px solid #0058E6;border-top:24px solid #0058E6;border-radius:6px 6px 0 0;display:none;flex-direction:column;z-index:99}
.win .t{position:absolute;top:-24px;left:0;right:0;height:24px;color:white;font-size:12px;font-weight:bold;display:flex;justify-content:space-between;padding:0 8px;align-items:center}
.win .c{flex:1;background:white;overflow:auto;padding:8px}
</style>
</head>
<body>
<div class="desktop">
<div class="icon" onclick="openW('My Computer','<b>Drives</b><br><br>💾 Local Disk (C:)<br>💿 CD Drive (D:)<br>📁 My Documents')"><img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-5.png">My Computer</div>
<div class="icon" onclick="openW('Paint','🎨 Paint khulyu!')"><img src="https://win98icons.alexmeub.com/icons/png/paint-0.png">Paint</div>
<div class="icon" onclick="openW('CMD','<div style=background:black;color:lime;padding:6px>Microsoft Windows XP<br>C:\\> help</div>')"><img src="https://win98icons.alexmeub.com/icons/png/console_prompt-0.png">CMD</div>
<div class="icon" onclick="window.open('https://youtube.com')"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">YouTube</div>
<div class="icon" onclick="window.open('https://wa.me')"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">WhatsApp</div>
<div class="icon" onclick="window.open('https://facebook.com')"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">Facebook</div>
<div class="icon" onclick="window.open('https://instagram.com')"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">Instagram</div>
<div class="icon" onclick="window.open('https://google.com')"><img src="https://cdn-icons-png.flaticon.com/512/300/300221.png">Internet</div>
</div>

<div id="startMenu">
<div class="start-top"><img src="https://i.pravatar.cc/32" style="border-radius:4px;width:32px"><span>XP User</span></div>
<div class="start-body">
<div class="start-left">
<div class="s-item" onclick="window.open('https://youtube.com')">▶️ YouTube</div>
<div class="s-item" onclick="window.open('https://wa.me')">💬 WhatsApp</div>
<div class="s-item" onclick="window.open('https://facebook.com')">📘 Facebook</div>
<div class="s-item" onclick="window.open('https://instagram.com')">📸 Instagram</div>
<div class="s-item" onclick="window.open('https://google.com')">🌐 Internet</div>
<div class="s-item" onclick="openW('Paint','Paint')">🎨 Paint</div>
<div class="s-item" onclick="openW('CMD','CMD')">⬛ CMD</div>
</div>
<div class="start-right">
<div class="s-item">📁 My Documents</div>
<div class="s-item">🖼️ My Pictures</div>
<div class="s-item">🎵 My Music</div>
<div class="s-item">⚙️ Control Panel</div>
<div class="s-item">🖨️ Printers</div>
<div class="s-item">❓ Help</div>
<div class="s-item">🔍 Search</div>
<div class="s-item">▶️ Run...</div>
</div>
</div>
</div>

<div id="win" class="win"><div class="t"><span id="wt">Window</span><span onclick="this.closest('.win').style.display='none'" style="background:red;padding:1px 8px;border:1px solid white;border-radius:3px;cursor:pointer">X</span></div><div class="c" id="wc"></div></div>
<div class="taskbar"><div class="start-btn" onclick="document.getElementById('startMenu').classList.toggle('open')">🪟 start</div><div style="color:white;margin-left:10px;font-size:11px" id="clk"></div></div>

<script>
function openW(t,c){document.getElementById('wt').innerText=t;document.getElementById('wc').innerHTML=c;document.getElementById('win').style.display='flex';document.getElementById('startMenu').classList.remove('open')}
setInterval(()=>document.getElementById('clk').innerText=new Date().toLocaleTimeString(),1000)
document.body.addEventListener('click',e=>{if(!e.target.closest('#startMenu')&&!e.target.closest('.start-btn'))document.getElementById('startMenu').classList.remove('open')})
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js')
</script>
</body>
</html>
