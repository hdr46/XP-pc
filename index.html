<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows XP</title>
<link rel="manifest" href="./manifest.json?v=12">
<meta name="theme-color" content="#245edb">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') center/cover no-repeat;height:100vh;overflow:hidden}
#desk{display:flex;flex-direction:column;gap:12px;padding:12px}
.mi{width:80px;text-align:center;color:white;text-shadow:1px 1px 1px black;cursor:pointer}
.mi img{width:32px;height:32px;display:block;margin:0 auto 4px;image-rendering:auto}
.win{position:absolute;top:20%;left:20%;width:400px;background:#ece9d8;border:2px solid #0055e5;border-radius:8px 8px 0 0;display:none;box-shadow:3px 3px 10px #000}
.bar{background:linear-gradient(#0058ee,#0a6cff);color:white;padding:6px 10px;display:flex;justify-content:space-between;border-radius:6px 6px 0 0;cursor:move}
.bar span{font-weight:bold}
.bar button{background:#e81123;color:white;border:1px solid white;border-radius:3px;width:22px}
.content{padding:15px;min-height:150px;background:white}
#task{position:absolute;bottom:0;left:0;width:100%;height:32px;background:linear-gradient(#2583ff,#0847c8);display:flex;align-items:center}
#startBtn{background:linear-gradient(#3ba33b,#1b6b1b);color:white;padding:4px 18px;border-radius:0 12px 12px 0;font-weight:bold;font-style:italic;cursor:pointer}
</style>
</head>
<body>
<div id="desk">
<div class="mi" onclick="openW('mycomp')"><img src="./icon-192.png">💻 My Computer</div>
<div class="mi" onclick="openW('files')"><img src="./icon-192.png">📁 My Files</div>
<div class="mi" onclick="openW('photo')"><img src="./icon-192.png">🖼️ Photos</div>
<div class="mi" onclick="checkUSB()"><img src="./icon-192.png">🔌 USB</div>
</div>

<div id="mycomp" class="win"><div class="bar"><span>My Computer</span><button onclick="closeW('mycomp')">X</button></div><div class="content">Welcome to XP! Your PWA is installed!</div></div>
<div id="files" class="win"><div class="bar"><span>Files</span><button onclick="closeW('files')">X</button></div><div class="content" id="fl"></div></div>
<div id="photo" class="win"><div class="bar"><span>Photos</span><button onclick="closeW('photo')">X</button></div><div class="content">Photos here</div></div>

<div id="task"><div id="startBtn" onclick="toggleM()">start</div></div>
<script>
function openW(id){document.getElementById(id).style.display='block'}
function closeW(id){document.getElementById(id).style.display='none'}
function checkUSB(){if('showDirectoryPicker' in window){alert('USB supported')}else{alert('Use Chrome for USB')}}
document.querySelectorAll('.bar').forEach(b=>{
let isDown=false, sx, sy, el=b.parentElement;
b.onmousedown=e=>{isDown=true;sx=e.clientX-el.offsetLeft;sy=e.clientY-el.offsetTop};
document.onmousemove=e=>{if(isDown){el.style.left=(e.clientX-sx)+'px';el.style.top=(e.clientY-sy)+'px'}};
document.onmouseup=()=>isDown=false;
});
</script>
</body>
</html>
