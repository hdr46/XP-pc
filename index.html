<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') no-repeat center center fixed;background-size:cover;font-family:'Tahoma',sans-serif;width:100vw;height:100vh;overflow:hidden}
#desktop{position:absolute;top:8px;left:8px}
.icon{width:75px;text-align:center;color:white;font-size:11px;text-shadow:1px 1px 1px black;margin-bottom:16px;cursor:pointer}
.icon img{width:48px;height:48px;display:block;margin:0 auto 4px auto;filter:drop-shadow(1px 1px 2px black)}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:32px;background:linear-gradient(#3C81F5,#245EDC);border-top:2px solid #5CA9FF;display:flex;align-items:center;z-index:999}
#startBtn{background:linear-gradient(#3EA83E,#1F7A1F);color:white;padding:0 20px;height:26px;display:flex;align-items:center;font-weight:bold;font-style:italic;border-radius:0 10px 10px 0;box-shadow:1px 1px 3px black;margin-left:2px;font-size:16px}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon"><img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-5.png">My Computer</div>
  <div class="icon"><img src="https://win98icons.alexmeub.com/icons/png/directory_open-5.png">My Files</div>
  <div class="icon"><img src="https://win98icons.alexmeub.com/icons/png/jpeg_image-5.png">Photos</div>
  <div class="icon"><img src="https://win98icons.alexmeub.com/icons/png/hard_disk-5.png">USB Drive</div>
</div>
<div id="taskbar"><div id="startBtn">start</div></div>
</body>
</html>
