<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XP-pc Real</title><style>body{margin:0;font-family:Tahoma;background:#008080 url('https://i.imgur.com/Zk6TR5k.jpg') center/cover fixed;height:100vh;overflow:hidden}.icon{width:84px;height:80px;color:white;text-align:center;margin:8px;float:left;text-shadow:1px 1px 2px black;font-size:11px}.icon b{font-size:36px;display:block}.win{position:fixed;background:#ece9d8;border:3px solid #0055e5;border-radius:8px 8px 0 0;display:none;flex-direction:column;top:4%;left:2%;width:96%;height:86%;z-index:10}.tit{background:linear-gradient(#0055e5,#3c81f5);color:white;padding:6px;display:flex;justify-content:space-between;font-weight:bold}.con{flex:1;background:white;overflow:auto}#bar{position:fixed;bottom:0;width:100%;height:36px;background:linear-gradient(#3c81f5,#245edb);display:flex;align-items:center;color:white;z-index:99}#st{background:linear-gradient(#3ba33b,#1f7a1f);color:white;border:0;border-radius:0 10px 10px 0;padding:6px 18px;font-weight:bold;font-style:italic;font-size:16px}</style></head><body><div id="desk"><div class="icon" onclick="O('yt')"><b>▶️</b>YouTube Real</div><div class="icon" onclick="O('map')"><b>🗺️</b>Google Map</div><div class="icon" onclick="O('notes')"><b>📝</b>Samsung Notes</div><div class="icon" onclick="O('paint')"><b>🎨</b>Paint Real</div><div class="icon" onclick="O('calc')"><b>🔢</b>Calculator</div><div class="icon" onclick="O('cam')"><b>📷</b>Camera</div><div class="icon" onclick="O('music')"><b>🎵</b>Music</div><div class="icon" onclick="O('browser')"><b>🌐</b>Browser Real</div></div><div id="w-yt" class="win"><div class="tit"><span>▶️ YouTube - Real</span><button onclick="C('yt')">X</button></div><div class="con"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/jfKfPfyJRdk" allowfullscreen></iframe></div></div><div id="w-map" class="win"><div class="tit"><span>🗺️ Google Map - Real</span><button onclick="C('map')">X</button></div><div class="con"><iframe width="100%" height="100%" src="https://maps.google.com/maps?q=Mumbai&t=&z=13&output=embed"></iframe></div></div><div id="w-notes" class="win" style="width:84%;height:70%;left:8%;top:8%"><div class="tit"><span>📝 Notes - Auto Save</span><button onclick="C('notes')">X</button></div><div class="con" style="padding:5px"><textarea id="nt" style="width:100%;height:90%;font-size:16px;padding:8px" placeholder="Ahi lakh, auto save thase"></textarea></div></div><div id="w-paint" class="win"><div class="tit"><span>🎨 Paint - Draw Real</span><button onclick="C('paint')">X</button></div><div class="con"><div style="background:#ece9d8;padding:4px"><input type="color" id="col" value="#ff0000"><button onclick="ctx.clearRect(0,0,900,500)">Clear</button></div><canvas id="cv" width="900" height="500" style="background:white;border:1px solid #999"></canvas></div></div><div id="w-calc" class="win" style="width:260px;height:330px;left:30%;top:15%"><div class="tit"><span>🔢 Calculator - Real</span><button onclick="C('calc')">X</button></div><div class="con" style="padding:10px;background:#ece9d8;text-align:center"><input id="cd" style="width:100%;height:45px;font-size:22px;text-align:right"><br><br><button onclick="cd.value+='7'">7</button><button onclick="cd.value+='8'">8</button><button onclick="cd.value+='9'">9</button><button onclick="cd.value+='/'">/</button><br><button onclick="cd.value+='4'">4</button><button onclick="cd.value+='5'">5</button><button onclick="cd.value+='6'">6</button><button onclick="cd.value+='*'">*</button><br><button onclick="cd.value+='1'">1</button><button onclick="cd.value+='2'">2</button><button onclick="cd.value+='3'">3</button><button onclick="cd.value+='-'">-</button><br><button onclick="cd.value+='0'">0</button><button onclick="cd.value+='.'">.</button><button onclick="try{cd.value=eval(cd.value)}catch(e){cd.value='Error'}">=</button><button onclick="cd.value+='+'">+</button><br><br><button onclick="cd.value=''">CLEAR ALL</button></div></div><div id="w-browser" class="win"><div class="tit"><span>🌐 Real Browser</span><button onclick="C('browser')">X</button></div><div class="con"><iframe width="100%" height="100%" src="https://www.google.com/search?igu=1" style="border:0"></iframe></div></div><div id="w-cam" class="win" style="width:80%;height:70%;left:10%;top:10%"><div class="tit"><span>📷 Real Camera</span><button onclick="C('cam')">X</button></div><div class="con" style="text-align:center"><video id="v" autoplay style="width:100%;background:black;max-height:75%"></video><br><button onclick="navigator.mediaDevices.getUserMedia({video:true}).then(s=>v.srcObject=s)">Start Camera</button></div></div><div id="w-music" class="win" style="width:70%;height:50%;left:15%;top:20%"><div class="tit"><span>🎵 Music Player</span><button onclick="C('music')">X</button></div><div class="con" style="padding:20px;background:#111;color:white;text-align:center"><audio id="au" controls style="width:100%"></audio><br><br><input type="file" accept="audio/*" onchange="if(this.files[0])au.src=URL.createObjectURL(this.files[0])"></div></div><div id="bar"><button id="st">start</button><div style="margin-left:auto;padding-right:10px" id="clk"></div></div><script>function O(i){document.getElementById('w-'+i).style.display='flex'}function C(i){document.getElementById('w-'+i).style.display='none'}setInterval(()=>clk.innerText=new Date().toLocaleTimeString(),1000);let nt=document.getElementById('nt');nt.value=localStorage.getItem('xp')||'';nt.oninput=()=>localStorage.setItem('xp',nt.value);let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),d=false;cv.addEventListener('mousedown',e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)});cv.addEventListener('mousemove',e=>{if(!d)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()});cv.addEventListener('mouseup',()=>d=false);cv.addEventListener('touchstart',e=>{d=true;let r=cv.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);e.preventDefault()});cv.addEventListener('touchmove',e=>{if(!d)return;let r=cv.getBoundingClientRect();ctx.lineTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);ctx.stroke();e.preventDefault()});cv.addEventListener('touchend',()=>d=false);</script></body></html>
