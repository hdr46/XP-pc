<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows XP PRO</title><style>
body{margin:0;background:#0085d0 url('https://w7.pngwing.com/pngs/77/693/png-transparent-blue-sky-and-green-grass-windows-xp-bliss-desktop-computer-wallpaper-desktop-blue-cloud-atmosphere-thumbnail.png') center/cover no-repeat fixed;font-family:Tahoma;height:100vh;overflow:hidden}
#d{padding:8px;display:flex;flex-wrap:wrap;gap:2px;height:calc(100vh - 35px);align-content:flex-start}
.i{width:84px;height:84px;color:#fff;text-shadow:1px 1px 2px #000;text-align:center;font-size:11px;padding:6px;border:1px solid transparent}
.i:active{background:rgba(0,0,255,.4);border:1px dotted #fff}.i b{font-size:32px;display:block}
.w{position:fixed;left:2%;top:5%;width:96%;height:85%;background:#ece9d8;border:2px solid #0055e5;border-radius:7px 7px 0 0;display:none;flex-direction:column;z-index:10;box-shadow:4px 4px 20px #000}
.t{height:30px;background:linear-gradient(#0a9cff,#0052d4);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-weight:bold;border-radius:5px 5px 0 0}
.c{flex:1;background:#fff;overflow:auto}
#bar{position:fixed;bottom:0;width:100%;height:35px;background:linear-gradient(#3a85ff,#1941a5);display:flex;align-items:center;z-index:999}
#sbtn{background:linear-gradient(#2f9d2f,#145a14);color:#fff;border:none;border-radius:0 10px 10px 0;padding:0 20px;height:100%;font-weight:bold;font-style:italic;font-size:16px}
#clk{margin-left:auto;color:#fff;padding:0 10px;background:#1490e0;height:100%;display:flex;align-items:center}
</style></head><body>
<div id=d>
<div class=i onclick="O('my')"><b>💻</b>My Computer</div>
<div class=i onclick="O('yt')"><b>▶️</b>YouTube</div>
<div class=i onclick="O('net')"><b>🌐</b>Internet</div>
<div class=i onclick="O('map')"><b>🗺️</b>Maps</div>
<div class=i onclick="O('doc')"><b>📁</b>Documents</div>
<div class=i onclick="O('note')"><b>📝</b>Notepad</div>
<div class=i onclick="O('paint')"><b>🎨</b>Paint</div>
<div class=i onclick="O('calc')"><b>🔢</b>Calculator</div>
<div class=i onclick="O('cam')"><b>📷</b>Camera</div>
<div class=i onclick="O('music')"><b>🎵</b>Music</div>
</div>

<div id=w-my class=w><div class=t><span>💻 My Computer</span><button onclick="C('my')">X</button></div><div class=c style="padding:15px"><h3>Drives</h3><div style="display:flex;gap:10px"><div style="border:1px solid #aaa;padding:10px;background:#eee">💿<br>C: Drive<br>120GB Free</div><div style="border:1px solid #aaa;padding:10px;background:#eee">💾<br>D: Drive<br>200GB Free</div></div></div></div>

<div id=w-yt class=w><div class=t><span>▶️ YouTube Real</span><button onclick="C('yt')">X</button></div><div class=c><iframe width="100%" height="100%" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen style="border:0"></iframe></div></div>

<div id=w-net class=w><div class=t><span>🌐 Browser Real</span><button onclick="C('net')">X</button></div><div class=c style="display:flex;flex-direction:column"><div style="padding:4px;background:#ece9d8;display:flex;gap:4px"><input id=u style="flex:1" value="https://www.google.com"><button onclick="f.src=document.getElementById('u').value">Go</button></div><iframe id=f style="flex:1;border:0" src="https://www.google.com/search?igu=1"></iframe></div></div>

<div id=w-map class=w><div class=t><span>🗺️ Google Maps Real</span><button onclick="C('map')">X</button></div><div class=c><iframe width="100%" height="100%" src="https://maps.google.com/maps?q=Mumbai&z=13&output=embed" style="border:0"></iframe></div></div>

<div id=w-doc class=w><div class=t><span>📁 My Documents</span><button onclick="C('doc')">X</button></div><div class=c style="padding:10px"><input type=file onchange="let d=document.createElement('div');d.innerHTML='📄 '+this.files[0].name;list.appendChild(d)"><div id=list style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px"></div></div></div>

<div id=w-note class=w><div class=t><span>📝 Notepad</span><button onclick="C('note')">X</button></div><div class=c style="display:flex;flex-direction:column"><button onclick="localStorage.setItem('n',tx.value);alert('Saved!')" style="padding:6px">💾 Save</button><textarea id=tx style="flex:1;border:0;padding:10px;font-size:14px" placeholder="Ahi lakh..."></textarea></div></div>

<div id=w-paint class=w><div class=t><span>🎨 Paint</span><button onclick="C('paint')">X</button></div><div class=c style="display:flex;flex-direction:column"><div style="padding:4px;background:#ece9d8;display:flex;gap:5px"><input type=color id=co><button onclick="lw=2">Thin</button><button onclick="lw=8">Thick</button><button onclick="ctx.clearRect(0,0,999,600)">Clear</button></div><canvas id=cv width=999 height=600 style="background:#fff;touch-action:none"></canvas></div></div>

<div id=w-calc class=w style="width:270px;height:360px;left:15%;top:10%"><div class=t><span>🔢 Calculator - REAL</span><button onclick="C('calc')">X</button></div><div class=c style="padding:10px;background:#ece9d8;text-align:center"><input id=cd style="width:100%;height:45px;font-size:22px;text-align:right"><br><br><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px"><button onclick="cd.value+='7'">7</button><button onclick="cd.value+='8'">8</button><button onclick="cd.value+='9'">9</button><button onclick="cd.value+='/'">/</button><button onclick="cd.value+='4'">4</button><button onclick="cd.value+='5'">5</button><button onclick="cd.value+='6'">6</button><button onclick="cd.value+='*'">*</button><button onclick="cd.value+='1'">1</button><button onclick="cd.value+='2'">2</button><button onclick="cd.value+='3'">3</button><button onclick="cd.value+='-'">-</button><button onclick="cd.value+='0'">0</button><button onclick="cd.value+='.'">.</button><button onclick="try{cd.value=eval(cd.value)}catch(e){cd.value='Error'}" style="background:#0055e5;color:#fff">=</button><button onclick="cd.value+='+'">+</button></div><button onclick="cd.value=''" style="width:100%;margin-top:8px">CLEAR</button></div></div>

<div id=w-cam class=w><div class=t><span>📷 Camera Real</span><button onclick="C('cam')">X</button></div><div class=c style="text-align:center;background:#000;color:#fff;padding:10px"><video id=vd autoplay style="width:100%;max-height:60%;background:#111"></video><br><br><button onclick="navigator.mediaDevices.getUserMedia({video:true}).then(s=>vd.srcObject=s)">Start Camera</button></div></div>

<div id=w-music class=w style="height:50%;top:25%"><div class=t><span>🎵 Music Real</span><button onclick="C('music')">X</button></div><div class=c style="padding:15px;text-align:center;background:#222;color:#fff"><audio id=au controls style="width:100%"></audio><br><br><input type=file accept="audio/*" onchange="au.src=URL.createObjectURL(this.files[0])"></div></div>

<div id=bar><button id=sbtn onclick="alert('Start Menu - XP PRO ma avse 😎')">start</button><div id=clk></div></div>

<script>
function O(x){document.querySelectorAll('.w').forEach(a=>a.style.display='none');document.getElementById('w-'+x).style.display='flex'}
function C(x){document.getElementById('w-'+x).style.display='none'}
setInterval(()=>clk.innerText=new Date().toLocaleTimeString(),1000);
let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),dr=false,lw=3;cv.addEventListener('touchstart',e=>{dr=true;let r=cv.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top)});cv.addEventListener('touchmove',e=>{if(!dr)return;let r=cv.getBoundingClientRect();ctx.lineWidth=lw;ctx.strokeStyle=co.value;ctx.lineTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);ctx.stroke();e.preventDefault()});cv.addEventListener('touchend',()=>dr=false);cv.addEventListener('mousedown',e=>{dr=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)});cv.addEventListener('mousemove',e=>{if(!dr)return;ctx.lineWidth=lw;ctx.strokeStyle=co.value;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()});cv.addEventListener('mouseup',()=>dr=false);
tx.value=localStorage.getItem('n')||'';tx.oninput=()=>localStorage.setItem('n',tx.value);
</script></body></html>
