<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000080"><link rel="manifest" href="manifest.json"><title>XP Social</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{user-select:none;height:100dvh;width:100vw;overflow:hidden;background:#008080;font-family:Tahoma,sans-serif}
#desktop{position:absolute;top:8px;left:8px;right:8px;bottom:40px;z-index:10;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px;overflow:hidden}
.dicon{width:72px;text-align:center;color:#fff;font-size:9px;text-shadow:1px 1px #000;padding:4px;cursor:pointer;flex-shrink:0}.dicon.box{width:48px;height:48px;margin:0 auto 3px;background:#ffffff33;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:2px 2px 4px #0005}
.win{position:fixed;background:#ece9d8;border:2px solid #000080;box-shadow:4px 4px 18px #000a;display:none;z-index:100;top:2%;left:1%;width:98%;height:88%;max-width:700px;max-height:92dvh}
.tbar{background:#000080;color:#fff;padding:4px 8px;display:flex;justify-content:space-between;font-weight:bold;font-size:12px}.close{background:red;color:#fff;width:26px;height:18px;display:flex;align-items:center;justify-content:center;border:1px solid #fff;cursor:pointer}.wbody{background:#fff;height:calc(100% - 24px);overflow:auto}
#startMenu{position:fixed;bottom:36px;left:0;width:420px;max-width:96vw;height:70vh;max-height:520px;background:#ece9d8;border:2px solid #000080;display:none;z-index:500;flex-direction:row}
#startMenu.open{display:flex}.s-left{width:60%;background:#fff;padding:5px;overflow:auto}.s-right{width:40%;background:#000080;color:#fff;padding:8px}.s-item{padding:6px;display:flex;gap:8px;font-size:11px;cursor:pointer}.s-item:hover{background:#000080;color:#fff}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:36px;background:#c0c0c0;border-top:2px solid #fff;display:flex;justify-content:space-between;align-items:center;z-index:600;padding:2px 0}
#startBtn{background:#000080;color:#fff;padding:2px 14px;height:28px;display:flex;align-items:center;gap:6px;font-weight:bold;border:2px outset #fff;margin-left:4px;cursor:pointer}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#ffffe1;border:2px solid #000;padding:10px 16px;z-index:9999;text-align:center}
#lockScreen{position:fixed;top:0;left:0;width:100vw;height:100dvh;background:linear-gradient(#5a7edc,#000080);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99998;color:#fff}
#bsod{position:fixed;top:0;left:0;width:100vw;height:100dvh;background:#0000aa;color:#fff;font-family:monospace;padding:20px;display:none;z-index:99999}
.mineCell{width:32px;height:32px;background:#c0c0c0;border:2px outset #fff;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}
.calDay{width:14.28%;height:34px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}.calDay.today{background:#000080;color:#fff}
</style></head><body>
<div id="lockScreen"><div style="font-size:60px">🪟</div><h2>Windows XP</h2><p>Social Pack v3 Offline</p><div style="background:#fff3;padding:20px;border-radius:10px;margin-top:20px;text-align:center"><div style="width:60px;height:60px;background:orange;border-radius:8px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:32px">👤</div><b>user</b><br><br><input id="passInput" type="password" placeholder="1234" style="padding:8px;border:2px inset #fff;width:160px;text-align:center"><br><br><button onclick="unlock()" style="padding:6px 20px;border:2px outset #fff;background:#ece9d8;font-weight:bold">Unlock ➜</button></div></div>
<div id="bsod" onclick="hideBSOD()"><div style="background:#fff;color:#0000aa;display:inline-block;padding:2px 8px;font-weight:bold">Windows</div><br><br>Error<br>RAM: <span id="bsodRam"></span> MB<br><span id="bsodCount">0</span><br><br>[Click]</div>
<div id="desktop">
<div class="dicon" onclick="openApp('computer')"><div class="box">💻</div>My Computer</div>

<div class="dicon" onclick="openApp('taskmgr')"><div class="box">📊</div>Task Mgr</div>
<div class="dicon" onclick="openApp('player')"><div class="box">🎵</div>Winamp</div>
<div class="dicon" onclick="openApp('mines')"><div class="box">💣</div>Mines</div>

</div>
