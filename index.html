<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') no-repeat center center fixed;background-size:cover;font-family:Tahoma;width:100vw;height:100vh;overflow:hidden;touch-action:manipulation}
#desktop{position:absolute;top:10px;left:10px;z-index:10}
.icon{width:75px;text-align:center;color:white;font-size:10px;text-shadow:1px 1px 2px black;margin-bottom:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon img{width:44px;height:44px;display:block;margin:0 auto 4px auto;pointer-events:none}
.window{position:fixed;top:10%;left:5%;width:90%;background:#ECE9D8;border:3px solid #0055E5;border-radius:8px 8px 0 0;display:none;z-index:100;box-shadow:5px 5px 20px black}
.title{background:linear-gradient(#3C81F5,#0055E5);color:white;padding:8px 10px;display:flex;justify-content:space-between;font-weight:bold}
.close{background:red;padding:2px 10px;border-radius:4px}
.content{background:white;margin:3px;padding:5px}
.item{padding:12px;border-bottom:1px solid #eee;font-size:14px}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:34px;background:linear-gradient(#3C81F5,#245EDC);border-top:2px solid #6BB3FF;display:flex;align-items:center;z-index:200}
#startBtn{background:linear-gradient(#3DBB3D,#1E7A1F);color:white;padding:0 20px;height:26px;display:flex;align-items:center;font-weight:bold;font-style:italic;border-radius:0 12px 12px 0}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" id="i1"><img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-5.png">My Computer</div>
  <div class="icon" id="i2"><img src="https://win98icons.alexmeub.com/icons/png/directory_open-5.png">My Files</div>
  <div class="icon" id="i3"><img src="https://win98icons.alexmeub.com/icons/png/jpeg_image-5.png">Photos</div>
  <div class="icon" id="i4"><img src="https://win98icons.alexmeub.com/icons/png/hard_disk-5.png">USB Drive</div>
</div>

<div id="w1" class="window"><div class="title"><span>My Computer</span><span class="close" id="c1">X</span></div><div class="content"><div class="item">💿 Local Disk (C:) 45GB free</div><div class="item">💿 Data (D:) 120GB free</div></div></div>
<div id="w2" class="window"><div class="title"><span>My Files</span><span class="close" id="c2">X</span></div><div class="content"><div class="item">📄 Resume.pdf</div><div class="item">🎵 Songs</div></div></div>
<div id="w3" class="window"><div class="title"><span>Photos</span><span class="close" id="c3">X</span></div><div class="content"><div class="item">🌄 Vacation.jpg</div><div class="item">👪 Family.jpg</div></div></div>
<div id="w4" class="window"><div class="title"><span>USB Drive</span><span class="close" id="c4">X</span></div><div class="content"><div class="item">📁 Connect USB</div></div></div>

<div id="taskbar"><div id="startBtn">start</div></div>

<script>
function openW(id){document.querySelectorAll('.window').forEach(w=>w.style.display='none');document.getElementById(id).style.display='block';}
function closeW(id){document.getElementById(id).style.display='none';}

document.getElementById('i1').addEventListener('click', ()=>openW('w1'));
document.getElementById('i2').addEventListener('click', ()=>openW('w2'));
document.getElementById('i3').addEventListener('click', ()=>openW('w3'));
document.getElementById('i4').addEventListener('click', ()=>openW('w4'));

document.getElementById('i1').addEventListener('touchstart', (e)=>{e.preventDefault();openW('w1');},{passive:false});
document.getElementById('i2').addEventListener('touchstart', (e)=>{e.preventDefault();openW('w2');},{passive:false});
document.getElementById('i3').addEventListener('touchstart', (e)=>{e.preventDefault();openW('w3');},{passive:false});
document.getElementById('i4').addEventListener('touchstart', (e)=>{e.preventDefault();openW('w4');},{passive:false});

document.getElementById('c1').addEventListener('click', ()=>closeW('w1'));
document.getElementById('c2').addEventListener('click', ()=>closeW('w2'));
document.getElementById('c3').addEventListener('click', ()=>closeW('w3'));
document.getElementById('c4').addEventListener('click', ()=>closeW('w4'));
</script>
</body>
</html>

</div>
