<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Windows XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:url('https://i.imgur.com/Zk6TR5k.jpg') no-repeat center center fixed;background-size:cover;font-family:Tahoma}
#desktop{position:absolute;top:15px;left:15px}
.icon{width:90px;text-align:center;color:white;font-size:14px;font-weight:bold;text-shadow:2px 2px 2px black;margin-bottom:25px;cursor:pointer}
.icon img{width:62px;height:62px;display:block;margin:0 auto 6px auto}
#mycompWin{position:absolute;top:20%;left:15%;width:70%;height:200px;background:#ECE9D8;border:3px solid #0055E5;display:none;box-shadow:5px 5px 15px black}
.title{background:#0055E5;color:white;padding:5px;display:flex;justify-content:space-between;font-weight:bold}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:42px;background:linear-gradient(#3C81F5,#245EDC);display:flex;align-items:center;border-top:2px solid #5A9CFF}
#startBtn{background:linear-gradient(#3BA33B,#1F7A1F);color:white;padding:0 25px;height:100%;display:flex;align-items:center;font-size:20px;font-weight:bold;font-style:italic;border-radius:0 12px 12px 0;cursor:pointer;box-shadow:2px 0 5px black}
</style>
</head>
<body>

<div id="desktop">
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'">
    <img src="https://cdn-icons-png.flaticon.com/128/3616/3616921.png">My Computer
  </div>
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'">
    <img src="https://cdn-icons-png.flaticon.com/128/3767/3767084.png">My Files
  </div>
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'">
    <img src="https://cdn-icons-png.flaticon.com/128/2503/2503011.png">Photos
  </div>
  <div class="icon" onclick="document.getElementById('mycompWin').style.display='block'">
    <img src="https://cdn-icons-png.flaticon.com/128/892/892683.png">USB
  </div>
</div>

<div id="mycompWin">
  <div class="title"><span>My Computer</span><span onclick="this.parentElement.parentElement.style.display='none'" style="background:red;padding:0 8px;cursor:pointer">X</span></div>
  <div style="padding:15px">Welcome to XP! Your PWA is installed!</div>
</div>

<div id="taskbar"><div id="startBtn">start</div></div>

</body>
</html>
